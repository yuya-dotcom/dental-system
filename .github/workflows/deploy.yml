name: Deploy to InfinityFree

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Bundle Composer dependencies into project/vendor/
      - name: Bundle Composer vendor into project/
        run: |
          test -f vendor/autoload.php
          cp -R vendor project/vendor
          printf 'Require all denied\n' > project/vendor/.htaccess

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./project/
          server-dir: /essenciasmile.online/htdocs/

          # Preview only; do not modify the live website.
          dry-run: true

          # Preserve default exclusions and production secrets.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            config/secrets.php
            **/config/secrets.php
            curl-check.php
